name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Guardar o modelo de voz entre builds
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-pt
          key: vosk-model-small-pt-0.3

      - name: Baixar o modelo de voz em português (vai dentro do APK, funciona offline)
        run: |
          if [ ! -f app/src/main/assets/model-pt/am/final.mdl ]; then
            curl -L --fail --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
            unzip -q model.zip
            rm -rf app/src/main/assets/model-pt
            mkdir -p app/src/main/assets
            mv vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          fi
          find app/src/main/assets/model-pt -type f | head -40

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar o APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Dar nome ao APK
        run: cp app/build/outputs/apk/release/app-release.apk VisitasMgeo-v${{ github.run_number }}.apk

      - name: Guardar o APK no build
        uses: actions/upload-artifact@v4
        with:
          name: VisitasMgeo-v${{ github.run_number }}
          path: VisitasMgeo-v${{ github.run_number }}.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Visitas Mgeo v${{ github.run_number }}
          body: Baixe o arquivo .apk abaixo e instale no celular. Instala por cima da versão anterior sem apagar os relatórios.
          files: VisitasMgeo-v${{ github.run_number }}.apk
          make_latest: true
